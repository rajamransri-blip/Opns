name: Build Android PAK Bot APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Auto Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Scaffold Project Source Files
        run: |
          mkdir -p app/src/main/java/com/pak/manager/ui/theme
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PakManagerBot"
          include(":app")
          EOF

          # 3. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.pak.manager"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.pak.manager"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.02.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              // OkHttp Networking
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")

              // Native Zstandard Compression Engine
              implementation("com.github.luben:zstd-jni:1.5.5-11@aar")
          }
          EOF

          # 5. Strings resource
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">PAK Bot Server</string>
          </resources>
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <service
                      android:name=".BotForegroundService"
                      android:foregroundServiceType="dataSync"
                      android:exported="false" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. Theme.kt
          cat << 'EOF' > app/src/main/java/com/pak/manager/ui/theme/Theme.kt
          package com.pak.manager.ui.theme

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color

          private val DarkColorScheme = darkColorScheme(
              primary = Color(0xFF64B5F6),
              secondary = Color(0xFF81C784),
              background = Color(0xFF121212),
              surface = Color(0xFF1E1E1E),
              onPrimary = Color.Black,
              onSecondary = Color.Black,
              onBackground = Color.White,
              onSurface = Color.White
          )

          @Composable
          fun PakManagerTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = DarkColorScheme,
                  content = content
              )
          }
          EOF

          # 8. PakEngine.kt (Zstd Decompressed Index + Flexible Search)
          cat << 'EOF' > app/src/main/java/com/pak/manager/PakEngine.kt
          package com.pak.manager

          import com.github.luben.zstd.Zstd
          import java.io.File
          import java.io.RandomAccessFile
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          data class PakEntry(
              val path: String,
              val offset: Long,
              val size: Long,
              val uncompressedSize: Long,
              val compressionMethod: Int,
              val structOffset: Long
          )

          object PakEngine {
              private const val PAK_MAGIC = 0x5A6F12E1L

              fun parseIndex(pakFile: File): List<PakEntry> {
                  val entries = mutableListOf<PakEntry>()
                  if (!pakFile.exists() || pakFile.length() < 204) return entries

                  try {
                      RandomAccessFile(pakFile, "r").use { raf ->
                          val len = raf.length()
                          raf.seek(maxOf(0L, len - 204))
                          val footer = ByteArray(204)
                          raf.readFully(footer)
                          val bb = ByteBuffer.wrap(footer).order(ByteOrder.LITTLE_ENDIAN)

                          val magic = bb.int.toLong() and 0xFFFFFFFFL
                          if (magic != PAK_MAGIC) return entries

                          val version = bb.int
                          val indexOffset = bb.long
                          val indexSize = bb.long

                          if (indexOffset <= 0 || indexOffset >= len) return entries

                          raf.seek(indexOffset)
                          val rawIndex = ByteArray(indexSize.toInt())
                          raf.readFully(rawIndex)

                          // Handle Zstandard compressed Index Table
                          val indexBytes: ByteArray = try {
                              val decompressedSize = Zstd.decompressedSize(rawIndex)
                              if (decompressedSize > 0) {
                                  val out = ByteArray(decompressedSize.toInt())
                                  Zstd.decompress(out, rawIndex)
                                  out
                              } else {
                                  rawIndex
                              }
                          } catch (e: Exception) {
                              rawIndex
                          }

                          val ib = ByteBuffer.wrap(indexBytes).order(ByteOrder.LITTLE_ENDIAN)

                          // Mount point string
                          val mountLen = ib.int
                          if (mountLen in 1..511) {
                              ib.position(ib.position() + mountLen)
                          }

                          val numEntries = ib.int
                          for (i in 0 until numEntries) {
                              if (ib.remaining() < 8) break
                              val entryPos = ib.position()
                              val pathLen = ib.int
                              if (pathLen <= 0 || pathLen > 1024 || pathLen > ib.remaining()) break
                              val pathBytes = ByteArray(pathLen)
                              ib.get(pathBytes)
                              val name = String(pathBytes).trimEnd('\u0000')

                              val fOffset = ib.long
                              val compSize = ib.long
                              val uncompSize = ib.long
                              val method = ib.int

                              ib.position(ib.position() + 20) // Skip SHA1
                              if (method != 0) {
                                  val blocks = ib.int
                                  ib.position(ib.position() + (blocks * 16))
                              }
                              ib.get() // isEncrypted
                              val blockSize = ib.int

                              entries.add(
                                  PakEntry(
                                      path = name,
                                      offset = fOffset,
                                      size = compSize,
                                      uncompressedSize = uncompSize,
                                      compressionMethod = method,
                                      structOffset = indexOffset + entryPos
                                  )
                              )
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
                  return entries
              }

              fun extractMatching(
                  pakFile: File,
                  searchQuery: String,
                  outDir: File,
                  onProgress: (Int) -> Unit
              ): List<File> {
                  val result = mutableListOf<File>()
                  val entries = parseIndex(pakFile)

                  // Sanitize search query: remove slashes and dots for flexible match
                  val cleanQuery = searchQuery.trim().replace("\\", "/").trim('/')
                  
                  val matches = entries.filter { entry ->
                      val cleanPath = entry.path.replace("\\", "/")
                      cleanPath.contains(cleanQuery, ignoreCase = true) ||
                      entry.path.endsWith(cleanQuery, ignoreCase = true)
                  }

                  if (matches.isEmpty()) return result
                  outDir.mkdirs()

                  RandomAccessFile(pakFile, "r").use { raf ->
                      matches.forEachIndexed { idx, entry ->
                          val pureName = entry.path.substringAfterLast('/').substringAfterLast('\\')
                          val target = File(outDir, pureName)

                          val headerSize = if (entry.compressionMethod != 0) 56 else 48
                          raf.seek(entry.offset + headerSize)

                          val raw = ByteArray(entry.size.toInt())
                          raf.readFully(raw)

                          if (entry.compressionMethod != 0 && entry.uncompressedSize > 0) {
                              val dec = ByteArray(entry.uncompressedSize.toInt())
                              Zstd.decompress(dec, raw)
                              target.writeBytes(dec)
                          } else {
                              target.writeBytes(raw)
                          }

                          result.add(target)
                          val progress = ((idx + 1) * 100) / matches.size
                          onProgress(progress)
                      }
                  }
                  return result
              }

              fun repackSingle(basePak: File, replacementFile: File, outPak: File): Boolean {
                  return try {
                      basePak.copyTo(outPak, overwrite = true)
                      val entries = parseIndex(outPak)
                      val targetEntry = entries.find { it.path.endsWith(replacementFile.name, ignoreCase = true) }
                          ?: return false

                      val rawBytes = replacementFile.readBytes()
                      val compressed = Zstd.compress(rawBytes, 3)

                      RandomAccessFile(outPak, "rw").use { raf ->
                          val newOffset = raf.length()
                          raf.seek(newOffset)

                          raf.writeLong(newOffset)
                          raf.writeLong(compressed.size.toLong())
                          raf.writeLong(rawBytes.size.toLong())
                          raf.writeInt(1)
                          raf.write(ByteArray(20))
                          raf.write(compressed)

                          raf.seek(targetEntry.structOffset + 4 + targetEntry.path.length + 1)
                          raf.writeLong(newOffset)
                          raf.writeLong(compressed.size.toLong())
                          raf.writeLong(rawBytes.size.toLong())
                      }
                      true
                  } catch (e: Exception) {
                      e.printStackTrace()
                      false
                  }
              }
          }
          EOF

          # 9. TelegramEngine.kt
          cat << 'EOF' > app/src/main/java/com/pak/manager/TelegramEngine.kt
          package com.pak.manager

          import android.content.Context
          import kotlinx.coroutines.*
          import okhttp3.*
          import okhttp3.MediaType.Companion.toMediaTypeOrNull
          import okhttp3.RequestBody.Companion.asRequestBody
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream
          import java.util.concurrent.TimeUnit

          class TelegramEngine(
              private val context: Context,
              private val token: String,
              private val adminChatId: String
          ) {
              private val client = OkHttpClient.Builder()
                  .connectTimeout(60, TimeUnit.SECONDS)
                  .readTimeout(60, TimeUnit.SECONDS)
                  .build()

              private var isRunning = false
              private var lastOffset = 0L
              private val scope = CoroutineScope(Dispatchers.IO + Job())

              private var currentStep = "IDLE"
              private var savedPak: File? = null

              fun start() {
                  isRunning = true
                  scope.launch {
                      sendMsg("🟢 *Server Bot Connected!*\nCommands:\n/unpack - Extract matching folder or file extension\n/repack - Replace file in PAK")
                      while (isRunning) {
                          try {
                              poll()
                          } catch (e: Exception) {
                              delay(2000)
                          }
                      }
                  }
              }

              fun stop() {
                  isRunning = false
                  scope.coroutineContext[Job]?.cancelChildren()
              }

              private fun poll() {
                  val url = "https://api.telegram.org/bot$token/getUpdates?offset=${lastOffset + 1}&timeout=25"
                  val request = Request.Builder().url(url).build()

                  client.newCall(request).execute().use { resp ->
                      if (!resp.isSuccessful) return
                      val res = resp.body?.string() ?: return
                      val json = JSONObject(res)
                      if (!json.optBoolean("ok")) return

                      val updates = json.optJSONArray("result") ?: return
                      for (i in 0 until updates.length()) {
                          val u = updates.getJSONObject(i)
                          lastOffset = u.optLong("update_id")

                          if (!u.has("message")) continue
                          val msg = u.getJSONObject("message")
                          val chat = msg.getJSONObject("chat").optLong("id").toString()
                          if (chat != adminChatId) continue

                          if (msg.has("document")) {
                              val doc = msg.getJSONObject("document")
                              val fId = doc.getString("file_id")
                              val fName = doc.optString("file_name", "archive.pak")
                              handleDoc(fId, fName)
                              continue
                          }

                          if (msg.has("text")) {
                              handleText(msg.getString("text").trim())
                          }
                      }
                  }
              }

              private fun handleText(text: String) {
                  when {
                      text.startsWith("/unpack") -> {
                          currentStep = "WAIT_UNPACK_PAK"
                          sendMsg("📦 Mode: *UNPACK*\nPlease send your `.pak` file:")
                      }
                      text.startsWith("/repack") -> {
                          currentStep = "WAIT_REPACK_PAK"
                          sendMsg("🛠 Mode: *REPACK*\nStep 1: Upload base `.pak` file:")
                      }
                      currentStep == "WAIT_UNPACK_PATH" -> {
                          executeUnpack(text)
                      }
                      else -> {
                          sendMsg("Active Options:\n• /unpack (Extract files)\n• /repack (Replace assets)")
                      }
                  }
              }

              private fun handleDoc(fileId: String, fileName: String) {
                  scope.launch {
                      when (currentStep) {
                          "WAIT_UNPACK_PAK" -> {
                              val msgId = sendMsg("📥 Downloading `.pak`: `$fileName`...")
                              val downloaded = downloadFile(fileId, fileName)
                              if (downloaded != null) {
                                  savedPak = downloaded
                                  currentStep = "WAIT_UNPACK_PATH"
                                  editText(
                                      msgId,
                                      "✅ *Downloaded:* `$fileName`\n\n👉 Send target folder or search path:\n(Examples: `BluePrints/Core`, `.lua`, or `BP_PlayerPawn.uasset`)"
                                  )
                              } else {
                                  editText(msgId, "❌ Download failed.")
                              }
                          }
                          "WAIT_REPACK_PAK" -> {
                              val msgId = sendMsg("📥 Downloading Base `.pak`: `$fileName`...")
                              val downloaded = downloadFile(fileId, fileName)
                              if (downloaded != null) {
                                  savedPak = downloaded
                                  currentStep = "WAIT_REPACK_FILE"
                                  editText(msgId, "✅ Base PAK saved.\n\n👉 Now upload the replacement file (`.uasset`, `.uexp`, `.lua`):")
                              } else {
                                  editText(msgId, "❌ Download failed.")
                              }
                          }
                          "WAIT_REPACK_FILE" -> {
                              val msgId = sendMsg("📥 Downloading replacement: `$fileName`...")
                              val downloaded = downloadFile(fileId, fileName)
                              if (downloaded != null && savedPak != null) {
                                  editText(msgId, "⚙️ Repacking into `.pak`...\n`[████████░░] 80%`")
                                  val outPak = File(context.cacheDir, "repacked_${savedPak!!.name}")
                                  val ok = PakEngine.repackSingle(savedPak!!, downloaded, outPak)
                                  if (ok) {
                                      editText(msgId, "✅ *Repack Complete!* Uploading...")
                                      uploadFile(outPak, "Repacked: ${outPak.name}")
                                  } else {
                                      editText(msgId, "❌ Target `$fileName` not found inside PAK index.")
                                  }
                                  currentStep = "IDLE"
                              }
                          }
                      }
                  }
              }

              private fun executeUnpack(targetPath: String) {
                  val pak = savedPak ?: run {
                      sendMsg("❌ No PAK cached. Send /unpack again.")
                      return
                  }

                  scope.launch {
                      val msgId = sendMsg("🔍 Scanning Zstd index and extracting files matching `$targetPath`...\n`[░░░░░░░░░░] 0%`")
                      val outDir = File(context.cacheDir, "extracted_${System.currentTimeMillis()}")

                      val files = PakEngine.extractMatching(pak, targetPath, outDir) { p ->
                          val bar = "[" + "█".repeat(p / 10) + "░".repeat(10 - (p / 10)) + "]"
                          editText(msgId, "⚙️ Unpacking `$targetPath`\n`$bar` $p%")
                      }

                      if (files.isEmpty()) {
                          editText(msgId, "❌ No files matched path:\n`$targetPath`\n\nTry sending part of the path (e.g. `BluePrints` or `.uasset` or `.lua`).")
                      } else {
                          editText(msgId, "✅ Extracted *${files.size}* real file(s)! Uploading to chat...")
                          for (f in files) {
                              uploadFile(f, "Name: ${f.name}\nSize: ${f.length()} bytes")
                          }
                      }
                      currentStep = "IDLE"
                  }
              }

              private fun downloadFile(fileId: String, fileName: String): File? {
                  return try {
                      val u = "https://api.telegram.org/bot$token/getFile?file_id=$fileId"
                      val r = Request.Builder().url(u).build()
                      val body = client.newCall(r).execute().body?.string() ?: return null
                      val path = JSONObject(body).getJSONObject("result").getString("file_path")

                      val dlUrl = "https://api.telegram.org/file/bot$token/$path"
                      val dlReq = Request.Builder().url(dlUrl).build()
                      val target = File(context.cacheDir, fileName)

                      client.newCall(dlReq).execute().body?.byteStream()?.use { inp ->
                          FileOutputStream(target).use { out -> inp.copyTo(out) }
                      }
                      target
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun uploadFile(file: File, caption: String) {
                  try {
                      val form = MultipartBody.Builder()
                          .setType(MultipartBody.FORM)
                          .addFormDataPart("chat_id", adminChatId)
                          .addFormDataPart("caption", caption)
                          .addFormDataPart("document", file.name, file.asRequestBody("application/octet-stream".toMediaTypeOrNull()))
                          .build()

                      val req = Request.Builder()
                          .url("https://api.telegram.org/bot$token/sendDocument")
                          .post(form)
                          .build()

                      client.newCall(req).execute().close()
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun sendMsg(text: String): Long {
                  return try {
                      val json = JSONObject().apply {
                          put("chat_id", adminChatId)
                          put("text", text)
                          put("parse_mode", "Markdown")
                      }
                      val req = Request.Builder()
                          .url("https://api.telegram.org/bot$token/sendMessage")
                          .post(json.toString().toRequestBody("application/json".toMediaTypeOrNull()))
                          .build()

                      client.newCall(req).execute().use { res ->
                          val s = res.body?.string() ?: return 0L
                          JSONObject(s).optJSONObject("result")?.optLong("message_id") ?: 0L
                      }
                  } catch (e: Exception) {
                      0L
                  }
              }

              private fun editText(messageId: Long, text: String) {
                  if (messageId == 0L) return
                  try {
                      val json = JSONObject().apply {
                          put("chat_id", adminChatId)
                          put("message_id", messageId)
                          put("text", text)
                          put("parse_mode", "Markdown")
                      }
                      val req = Request.Builder()
                          .url("https://api.telegram.org/bot$token/editMessageText")
                          .post(json.toString().toRequestBody("application/json".toMediaTypeOrNull()))
                          .build()

                      client.newCall(req).execute().close()
                  } catch (e: Exception) {
                      // Handled
                  }
              }
          }
          EOF

          # 10. BotForegroundService.kt
          cat << 'EOF' > app/src/main/java/com/pak/manager/BotForegroundService.kt
          package com.pak.manager

          import android.app.*
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat

          class BotForegroundService : Service() {
              private var engine: TelegramEngine? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  createChannel()
                  val notif = NotificationCompat.Builder(this, "pak_server_channel")
                      .setContentTitle("PAK Bot Active")
                      .setContentText("Worker listening for Telegram tasks...")
                      .setSmallIcon(android.R.drawable.stat_notify_sync)
                      .setOngoing(true)
                      .build()

                  startForeground(101, notif)

                  val token = intent?.getStringExtra("TOKEN") ?: ""
                  val chatId = intent?.getStringExtra("CHAT_ID") ?: ""

                  if (engine == null && token.isNotEmpty()) {
                      engine = TelegramEngine(this, token, chatId)
                      engine?.start()
                  }
                  return START_STICKY
              }

              override fun onDestroy() {
                  engine?.stop()
                  super.onDestroy()
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val c = NotificationChannel(
                          "pak_server_channel",
                          "PAK Server Daemon",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java)?.createNotificationChannel(c)
                  }
              }
          }
          EOF

          # 11. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/pak/manager/MainActivity.kt
          package com.pak.manager

          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.PlayArrow
          import androidx.compose.material.icons.filled.Stop
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.pak.manager.ui.theme.PakManagerTheme

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      PakManagerTheme {
                          Surface(
                              modifier = Modifier.fillMaxSize(),
                              color = MaterialTheme.colorScheme.background
                          ) {
                              DashboardUI(
                                  onStart = { token, chat ->
                                      val it = Intent(this, BotForegroundService::class.java).apply {
                                          putExtra("TOKEN", token)
                                          putExtra("CHAT_ID", chat)
                                      }
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                          startForegroundService(it)
                                      } else {
                                          startService(it)
                                      }
                                  },
                                  onStop = {
                                      stopService(Intent(this, BotForegroundService::class.java))
                                  }
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          fun DashboardUI(
              onStart: (String, String) -> Unit,
              onStop: () -> Unit
          ) {
              var botToken by remember { mutableStateOf("7630015663:AAHw-nYvbDamHjdcqrsBk2dw1bifSDllTLE") }
              var chatId by remember { mutableStateOf("5913394915") }
              var isRunning by remember { mutableStateOf(false) }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(16.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  Text(
                      text = "PAK Manager Engine",
                      fontSize = 22.sp,
                      fontWeight = FontWeight.Bold,
                      color = MaterialTheme.colorScheme.primary
                  )

                  OutlinedTextField(
                      value = botToken,
                      onValueChange = { botToken = it },
                      label = { Text("Telegram Bot Token") },
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth()
                  )

                  OutlinedTextField(
                      value = chatId,
                      onValueChange = { chatId = it },
                      label = { Text("Admin Chat ID") },
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth()
                  )

                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      Button(
                          onClick = {
                              isRunning = true
                              onStart(botToken, chatId)
                          },
                          enabled = !isRunning,
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF2E7D32)),
                          modifier = Modifier.weight(1f)
                      ) {
                          Icon(Icons.Filled.PlayArrow, contentDescription = null)
                          Spacer(modifier = Modifier.width(6.dp))
                          Text("Start Bot")
                      }

                      Button(
                          onClick = {
                              isRunning = false
                              onStop()
                          },
                          enabled = isRunning,
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFC62828)),
                          modifier = Modifier.weight(1f)
                      ) {
                          Icon(Icons.Filled.Stop, contentDescription = null)
                          Spacer(modifier = Modifier.width(6.dp))
                          Text("Stop Bot")
                      }
                  }

                  Card(
                      shape = RoundedCornerShape(8.dp),
                      colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                      modifier = Modifier
                          .fillMaxWidth()
                          .weight(1f)
                  ) {
                      Column(modifier = Modifier.padding(12.dp)) {
                          Text(
                              text = "Status: " + if (isRunning) "ACTIVE (Foreground Daemon)" else "STOPPED",
                              fontWeight = FontWeight.SemiBold,
                              color = if (isRunning) Color(0xFF81C784) else Color(0xFFE57373)
                          )
                          Spacer(modifier = Modifier.height(8.dp))
                          Text(
                              text = "• Zstandard Decompressed Index: Enabled\n• Substring Search: Active (.uasset, .uexp, .lua)\n• Real File Stream Extractor: Ready\n• Live Edit Progress Bar: Active",
                              fontSize = 13.sp,
                              color = Color.LightGray
                          )
                      }
                  }
              }
          }
          EOF

      - name: Generate Official Gradle Wrapper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gradle
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Pak-Manager-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
