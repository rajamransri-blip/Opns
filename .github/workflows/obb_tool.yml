name: Generate Source & Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  generate-and-build:
    name: Scaffold App & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Auto Accept Android Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Scaffold Android Project Source Code
        run: |
          mkdir -p app/src/main/java/com/pak/manager/ui/theme
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PakManagerBot"
          include(":app")
          EOF

          # 3. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 4. App Module build.gradle.kts (With Zstandard & OkHttp Telegram Dependencies)
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.pak.manager"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.pak.manager"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.02.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              // Networking & Background Tasks
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")

              // Zstandard Decompression/Compression Engine for Unreal PAK
              implementation("com.github.luben:zstd-jni:1.5.5-11@aar")
          }
          EOF

          # 5. Strings resource
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">PAK Bot Server</string>
          </resources>
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. Theme.kt
          cat << 'EOF' > app/src/main/java/com/pak/manager/ui/theme/Theme.kt
          package com.pak.manager.ui.theme

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color

          private val DarkColorScheme = darkColorScheme(
              primary = Color(0xFF64B5F6),
              secondary = Color(0xFF81C784),
              background = Color(0xFF121212),
              surface = Color(0xFF1E1E1E),
              onPrimary = Color.Black,
              onSecondary = Color.Black,
              onBackground = Color.White,
              onSurface = Color.White
          )

          @Composable
          fun PakManagerTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = DarkColorScheme,
                  content = content
              )
          }
          EOF

          # 8. PakEngine.kt (Zstandard + UE Pak Handling Logic)
          cat << 'EOF' > app/src/main/java/com/pak/manager/PakEngine.kt
          package com.pak.manager

          import com.github.luben.zstd.ZstdInputStream
          import com.github.luben.zstd.ZstdOutputStream
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream

          object PakEngine {
              // UE Pak Magic Bytes: 0x5A6F12E1
              const val PAK_MAGIC = 0x5A6F12E1L

              fun decompressZstd(compressedFile: File, outputFile: File): Boolean {
                  return try {
                      FileInputStream(compressedFile).use { fis ->
                          ZstdInputStream(fis).use { zis ->
                              FileOutputStream(outputFile).use { fos ->
                                  zis.copyTo(fos)
                              }
                          }
                      }
                      true
                  } catch (e: Exception) {
                      e.printStackTrace()
                      false
                  }
              }

              fun compressZstd(sourceFile: File, outputFile: File, level: Int = 3): Boolean {
                  return try {
                      FileInputStream(sourceFile).use { fis ->
                          FileOutputStream(outputFile).use { fos ->
                              ZstdOutputStream(fos, level).use { zos ->
                                  fis.copyTo(zos)
                              }
                          }
                      }
                      true
                  } catch (e: Exception) {
                      e.printStackTrace()
                      false
                  }
              }
          }
          EOF

          # 9. MainActivity.kt (UI + Bot Status Controls)
          cat << 'EOF' > app/src/main/java/com/pak/manager/MainActivity.kt
          package com.pak.manager

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.PlayArrow
          import androidx.compose.material.icons.filled.Stop
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.pak.manager.ui.theme.PakManagerTheme

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      PakManagerTheme {
                          Surface(
                              modifier = Modifier.fillMaxSize(),
                              color = MaterialTheme.colorScheme.background
                          ) {
                              BotServerDashboard()
                          }
                      }
                  }
              }
          }

          @Composable
          fun BotServerDashboard() {
              var botToken by remember { mutableStateOf("") }
              var chatId by remember { mutableStateOf("") }
              var isRunning by remember { mutableStateOf(false) }
              var logs by remember { mutableStateOf("Logs:\n[System] Core engine with Zstd & OkHttp initialized.") }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(16.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  Text(
                      text = "PAK Unpack/Repack Server",
                      fontSize = 22.sp,
                      fontWeight = FontWeight.Bold,
                      color = MaterialTheme.colorScheme.primary
                  )

                  OutlinedTextField(
                      value = botToken,
                      onValueChange = { botToken = it },
                      label = { Text("Telegram Bot Token") },
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth()
                  )

                  OutlinedTextField(
                      value = chatId,
                      onValueChange = { chatId = it },
                      label = { Text("Admin Chat ID") },
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth()
                  )

                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      Button(
                          onClick = {
                              isRunning = true
                              logs += "\n[Server] Polling active. Ready for .pak and paths."
                          },
                          enabled = !isRunning,
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF2E7D32)),
                          modifier = Modifier.weight(1f)
                      ) {
                          Icon(Icons.Filled.PlayArrow, contentDescription = null)
                          Spacer(modifier = Modifier.width(6.dp))
                          Text("Start Bot")
                      }

                      Button(
                          onClick = {
                              isRunning = false
                              logs += "\n[Server] Bot engine stopped."
                          },
                          enabled = isRunning,
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFC62828)),
                          modifier = Modifier.weight(1f)
                      ) {
                          Icon(Icons.Filled.Stop, contentDescription = null)
                          Spacer(modifier = Modifier.width(6.dp))
                          Text("Stop Bot")
                      }
                  }

                  Card(
                      shape = RoundedCornerShape(8.dp),
                      colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                      modifier = Modifier
                          .fillMaxWidth()
                          .weight(1f)
                  ) {
                      Column(modifier = Modifier.padding(12.dp)) {
                          Text(
                              text = "Status: " + if (isRunning) "ACTIVE (Polling)" else "STOPPED",
                              fontWeight = FontWeight.SemiBold,
                              color = if (isRunning) Color(0xFF81C784) else Color(0xFFE57373)
                          )
                          Spacer(modifier = Modifier.height(8.dp))
                          Text(
                              text = logs,
                              fontSize = 12.sp,
                              color = Color.LightGray
                          )
                      }
                  }
              }
          }
          EOF

      - name: Generate Official Gradle Wrapper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gradle
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Pak-Manager-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
