name: Generate Source & Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  generate-and-build:
    name: Scaffold App & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Auto Accept Android Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Scaffold Android Project Source Code
        run: |
          mkdir -p app/src/main/java/com/pak/manager/ui/theme
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url = java.net.URI("https://chaquo.com/maven") }
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = java.net.URI("https://chaquo.com/maven") }
              }
          }
          rootProject.name = "PakManagerBot"
          include(":app")
          EOF

          # 3. Root build.gradle.kts (With Chaquopy plugin)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              id("com.chaquo.python") version "15.0.1" apply false
          }
          EOF

          # 4. App Module build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.chaquo.python")
          }

          android {
              namespace = "com.pak.manager"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.pak.manager"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"

                  ndk {
                      abiFilters += listOf("arm64-v8a", "armeabi-v7a")
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          chaquopy {
              defaultConfig {
                  version = "3.10"
                  pip {
                      install("zstandard")
                  }
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.02.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              // Live Networking & Polling Loop
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")

              // Native Zstandard
              implementation("com.github.luben:zstd-jni:1.5.5-11@aar")
          }
          EOF

          # 5. Strings resource
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">PAK Bot Server</string>
          </resources>
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. Theme.kt
          cat << 'EOF' > app/src/main/java/com/pak/manager/ui/theme/Theme.kt
          package com.pak.manager.ui.theme

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color

          private val DarkColorScheme = darkColorScheme(
              primary = Color(0xFF64B5F6),
              secondary = Color(0xFF81C784),
              background = Color(0xFF121212),
              surface = Color(0xFF1E1E1E),
              onPrimary = Color.Black,
              onSecondary = Color.Black,
              onBackground = Color.White,
              onSurface = Color.White
          )

          @Composable
          fun PakManagerTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = DarkColorScheme,
                  content = content
              )
          }
          EOF

          # 8. PakEngine.kt (Chunk-based Stream Zstd System)
          cat << 'EOF' > app/src/main/java/com/pak/manager/PakEngine.kt
          package com.pak.manager

          import com.github.luben.zstd.ZstdInputStream
          import com.github.luben.zstd.ZstdOutputStream
          import java.io.*

          object PakEngine {
              const val CHUNK_SIZE = 64 * 1024 // 64 KB standard UE chunk block

              fun unpackChunked(inputStream: InputStream, outputStream: OutputStream): Boolean {
                  return try {
                      ZstdInputStream(inputStream).use { zstdIn ->
                          val buffer = ByteArray(CHUNK_SIZE)
                          var bytesRead: Int
                          while (zstdIn.read(buffer).also { bytesRead = it } != -1) {
                              outputStream.write(buffer, 0, bytesRead)
                          }
                          outputStream.flush()
                      }
                      true
                  } catch (e: Exception) {
                      e.printStackTrace()
                      false
                  }
              }

              fun repackChunked(sourceFile: File, outputFile: File, level: Int = 3): Boolean {
                  return try {
                      FileInputStream(sourceFile).use { fis ->
                          FileOutputStream(outputFile).use { fos ->
                              ZstdOutputStream(fos, level).use { zstdOut ->
                                  val buffer = ByteArray(CHUNK_SIZE)
                                  var bytesRead: Int
                                  while (fis.read(buffer).also { bytesRead = it } != -1) {
                                      zstdOut.write(buffer, 0, bytesRead)
                                  }
                                  zstdOut.flush()
                              }
                          }
                      }
                      true
                  } catch (e: Exception) {
                      e.printStackTrace()
                      false
                  }
              }
          }
          EOF

          # 9. TelegramBotService.kt (Real Long-Polling Loop Engine)
          cat << 'EOF' > app/src/main/java/com/pak/manager/TelegramBotService.kt
          package com.pak.manager

          import kotlinx.coroutines.*
          import okhttp3.*
          import okhttp3.MediaType.Companion.toMediaTypeOrNull
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONObject
          import java.io.File
          import java.io.IOException
          import java.util.concurrent.TimeUnit

          class TelegramBotService(
              private val token: String,
              private val allowedChatId: String,
              private val onLog: (String) -> Unit
          ) {
              private val client = OkHttpClient.Builder()
                  .connectTimeout(60, TimeUnit.SECONDS)
                  .readTimeout(60, TimeUnit.SECONDS)
                  .build()

              private var isPolling = false
              private var lastUpdateId = 0L
              private val scope = CoroutineScope(Dispatchers.IO + Job())

              fun start() {
                  isPolling = true
                  onLog("[Server] Starting active polling loop...")
                  scope.launch {
                      sendTextMessage(allowedChatId, "🤖 *Pak Server Bot Started!*\nSelect option:\n/unpack - Unpack .pak\n/repack - Repack files")
                      while (isPolling) {
                          try {
                              pollUpdates()
                          } catch (e: Exception) {
                              onLog("[Network Error] ${e.message}")
                              delay(3000)
                          }
                      }
                  }
              }

              fun stop() {
                  isPolling = false
                  scope.coroutineContext[Job]?.cancelChildren()
                  onLog("[Server] Polling stopped.")
              }

              private fun pollUpdates() {
                  val url = "https://api.telegram.org/bot$token/getUpdates?offset=${lastUpdateId + 1}&timeout=30"
                  val request = Request.Builder().url(url).build()

                  client.newCall(request).execute().use { response ->
                      if (!response.isSuccessful) return
                      val jsonStr = response.body?.string() ?: return
                      val jsonObj = JSONObject(jsonStr)
                      if (!jsonObj.optBoolean("ok")) return

                      val result = jsonObj.optJSONArray("result") ?: return
                      for (i in 0 until result.length()) {
                          val update = result.getJSONObject(i)
                          lastUpdateId = update.optLong("update_id")

                          if (update.has("message")) {
                              val msg = update.getJSONObject("message")
                              val fromChatId = msg.getJSONObject("chat").optLong("id").toString()
                              val text = msg.optString("text", "")

                              if (fromChatId == allowedChatId) {
                                  onLog("[Incoming] $text")
                                  handleCommand(fromChatId, text)
                              }
                          }
                      }
                  }
              }

              private fun handleCommand(chatId: String, text: String) {
                  when {
                      text.startsWith("/start") -> {
                          sendTextMessage(chatId, "Welcome! Commands:\n1. Send `.pak` file for Unpack\n2. Send folder path (e.g. /Content/BluePrints/Core/)")
                      }
                      text.startsWith("/unpack") -> {
                          sendTextMessage(chatId, "Please upload your .pak file now.")
                      }
                      text.startsWith("/repack") -> {
                          sendTextMessage(chatId, "Please upload the target files to repack.")
                      }
                      text.contains("/") -> {
                          sendTextMessage(chatId, "Path registered: `$text`\nChunk scanning initialized.")
                      }
                      else -> {
                          sendTextMessage(chatId, "Command received: $text")
                      }
                  }
              }

              private fun sendTextMessage(chatId: String, text: String) {
                  val json = JSONObject().apply {
                      put("chat_id", chatId)
                      put("text", text)
                      put("parse_mode", "Markdown")
                  }
                  val body = json.toString().toRequestBody("application/json".toMediaTypeOrNull())
                  val request = Request.Builder()
                      .url("https://api.telegram.org/bot$token/sendMessage")
                      .post(body)
                      .build()

                  client.newCall(request).enqueue(object : Callback {
                      override fun onFailure(call: Call, e: IOException) {
                          onLog("[Send Error] ${e.message}")
                      }
                      override fun onResponse(call: Call, response: Response) {
                          response.close()
                      }
                  })
              }
          }
          EOF

          # 10. MainActivity.kt (Auto Hook Token & Real Lifecycle)
          cat << 'EOF' > app/src/main/java/com/pak/manager/MainActivity.kt
          package com.pak.manager

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.PlayArrow
          import androidx.compose.material.icons.filled.Stop
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.pak.manager.ui.theme.PakManagerTheme

          class MainActivity : ComponentActivity() {
              private var botService: TelegramBotService? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      PakManagerTheme {
                          Surface(
                              modifier = Modifier.fillMaxSize(),
                              color = MaterialTheme.colorScheme.background
                          ) {
                              BotServerDashboard(
                                  onStart = { token, chat, logger ->
                                      botService = TelegramBotService(token, chat, logger).also { it.start() }
                                  },
                                  onStop = {
                                      botService?.stop()
                                      botService = null
                                  }
                              )
                          }
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  botService?.stop()
              }
          }

          @Composable
          fun BotServerDashboard(
              onStart: (String, String, (String) -> Unit) -> Unit,
              onStop: () -> Unit
          ) {
              var botToken by remember { mutableStateOf("7630015663:AAHw-nYvbDamHjdcqrsBk2dw1bifSDllTLE") }
              var chatId by remember { mutableStateOf("5913394915") }
              var isRunning by remember { mutableStateOf(false) }
              var logs by remember { mutableStateOf("Logs:\n[System] Core engine & Chaquopy ready.") }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(16.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  Text(
                      text = "PAK Unpack/Repack Server",
                      fontSize = 22.sp,
                      fontWeight = FontWeight.Bold,
                      color = MaterialTheme.colorScheme.primary
                  )

                  OutlinedTextField(
                      value = botToken,
                      onValueChange = { botToken = it },
                      label = { Text("Telegram Bot Token") },
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth()
                  )

                  OutlinedTextField(
                      value = chatId,
                      onValueChange = { chatId = it },
                      label = { Text("Admin Chat ID") },
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth()
                  )

                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      Button(
                          onClick = {
                              isRunning = true
                              onStart(botToken, chatId) { newLog ->
                                  logs += "\n$newLog"
                              }
                          },
                          enabled = !isRunning,
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF2E7D32)),
                          modifier = Modifier.weight(1f)
                      ) {
                          Icon(Icons.Filled.PlayArrow, contentDescription = null)
                          Spacer(modifier = Modifier.width(6.dp))
                          Text("Start Bot")
                      }

                      Button(
                          onClick = {
                              isRunning = false
                              onStop()
                          },
                          enabled = isRunning,
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFC62828)),
                          modifier = Modifier.weight(1f)
                      ) {
                          Icon(Icons.Filled.Stop, contentDescription = null)
                          Spacer(modifier = Modifier.width(6.dp))
                          Text("Stop Bot")
                      }
                  }

                  Card(
                      shape = RoundedCornerShape(8.dp),
                      colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                      modifier = Modifier
                          .fillMaxWidth()
                          .weight(1f)
                  ) {
                      Column(modifier = Modifier.padding(12.dp)) {
                          Text(
                              text = "Status: " + if (isRunning) "ACTIVE (Polling Network)" else "STOPPED",
                              fontWeight = FontWeight.SemiBold,
                              color = if (isRunning) Color(0xFF81C784) else Color(0xFFE57373)
                          )
                          Spacer(modifier = Modifier.height(8.dp))
                          Text(
                              text = logs,
                              fontSize = 12.sp,
                              color = Color.LightGray
                          )
                      }
                  }
              }
          }
          EOF

      - name: Generate Official Gradle Wrapper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gradle
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Pak-Manager-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
