name: OBB & PAK Auto Unpacker

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Action (unpack ya repack)'
        required: true
        default: 'unpack'
        type: choice
        options:
          - unpack
          - repack
      aes_key:
        description: '(Optional) Custom AES Key'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fix-folder-names:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Linux
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Folder Names
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python3 -c '
          import os, subprocess
          for item in os.listdir("."):
              if os.path.isdir(item) and (item.endswith(" ") or "PC" in item):
                  subprocess.run(["git", "mv", item, "tools"])
          '
          git add tools/ 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Normalize tool folder [skip ci]" && git push origin HEAD:main)

  process:
    needs: fix-folder-names
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Multi-Binary Unpack & Decrypt Engine
        shell: python
        env:
          ACTION_TYPE: ${{ github.event.inputs.action_type }}
          AES_KEY: ${{ github.event.inputs.aes_key }}
        run: |
          import os
          import sys
          import glob
          import subprocess
          import urllib.request

          os.makedirs("original_pak", exist_ok=True)
          os.makedirs("unpacked", exist_ok=True)

          print("=== STEP 1: Tool & Binary Discovery ===")
          quickbms = None
          bms_script = None
          uasset_gui = None

          for root, _, files in os.walk("."):
              for f in files:
                  low = f.lower()
                  if low == "quickbms_4gb_files.exe" and not quickbms:
                      quickbms = os.path.abspath(os.path.join(root, f))
                  elif low == "quickbms.exe" and not quickbms:
                      quickbms = os.path.abspath(os.path.join(root, f))
                  elif low == "script.bms" and not bms_script:
                      bms_script = os.path.abspath(os.path.join(root, f))
                  elif low == "uassetgui.exe" and not uasset_gui:
                      uasset_gui = os.path.abspath(os.path.join(root, f))

          print("QuickBMS Binary :", quickbms)
          print("Local BMS Script:", bms_script)
          print("UAssetGUI Binary:", uasset_gui)

          print("\n=== STEP 2: Input File Detection & Merging ===")
          parts = sorted(glob.glob("original_pak/*.part_*") or glob.glob("**/*.part_*", recursive=True))
          target_path = None

          if parts:
              print(f"Found {len(parts)} split parts. Merging into original_pak/game_patch.pak...")
              merged = os.path.abspath("original_pak/game_patch.pak")
              with open(merged, "wb") as out_f:
                  for p in parts:
                      with open(p, "rb") as in_f:
                          out_f.write(in_f.read())
              target_path = merged
          else:
              candidates = glob.glob("original_pak/*.pak") + glob.glob("original_pak/*.obb")
              if not candidates:
                  candidates = [f for f in glob.glob("**/*", recursive=True) if f.lower().endswith((".pak", ".obb")) and "tools" not in f.lower()]
              if candidates:
                  target_path = os.path.abspath(candidates[0])

          if not target_path or not os.path.exists(target_path):
              print("ERROR: Target game package not found in repo!")
              sys.exit(1)

          file_size_mb = os.path.getsize(target_path) / (1024 * 1024)
          print(f"Target Confirmed: {target_path} ({file_size_mb:.2f} MB)")

          unpacked_dir = os.path.abspath("unpacked")

          def count_files():
              cnt = 0
              for _, _, f in os.walk(unpacked_dir):
                  cnt += len(f)
              return cnt

          print("\n=== STEP 3: Executing Unpack Engine ===")
          action = os.environ.get("ACTION_TYPE", "unpack").strip()
          custom_key = os.environ.get("AES_KEY", "").strip()

          if action == "unpack":
              # 1. Try local script.bms
              print("[Method 1] Running with local script.bms...")
              subprocess.run([quickbms, "-o", "-y", "-e", bms_script, target_path, unpacked_dir], capture_output=True)

              # 2. If 0 files, switch to Unreal Engine 4 script & test known keys
              if count_files() == 0:
                  print("[Method 2] Switching to Unreal Engine 4 PAK Decryption...")
                  ue4_script = os.path.abspath("ue4_pak.bms")
                  try:
                      urllib.request.urlretrieve("https://aluigi.altervista.org/bms/unreal_tournament_4.bms", ue4_script)
                  except Exception as ex:
                      print("Script download warning:", ex)

                  keys_to_test = [
                      custom_key,
                      "0x8035DAFA76249A09FD0F210452E0EF3EAF7F83D398E187EBBE52D82D6D3A0A06",
                      "0xC7497217B27C12F6C6C8ACF8CF87BE792A62C0EEBC3DE33DF7EBCEBFF09A1208",
                      "0xDD11E2CF20942F9E58A4633887192C2B295627E431EB9A17154E89745A1A4E7A",
                      "0x48657820746F204153434949202D204F6E6C696E6520746F6F6C000000000000",
                      "0x9D8C9A4A4FA082F213EED604B6E756237181685EEDA82216437617D7AA5231AF"
                  ]
                  keys_to_test = [k for k in keys_to_test if k]

                  for k in keys_to_test:
                      print(f"Testing Key: {k[:16]}...")
                      p = subprocess.Popen(
                          [quickbms, "-o", "-y", "-e", ue4_script, target_path, unpacked_dir],
                          stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE
                      )
                      # Send key directly to stdin prompt
                      p.communicate(input=(k + "\n").encode(), timeout=60)
                      if count_files() > 0:
                          print(f"SUCCESS: Decrypted using key {k[:16]}...!")
                          break

              # 3. Fallback: 7-Zip Container
              if count_files() == 0:
                  print("[Method 3] Trying 7-Zip extraction...")
                  subprocess.run(["7z", "x", target_path, f"-o{unpacked_dir}", "-y"], capture_output=True)
          else:
              print("Executing Repack with QuickBMS...")
              subprocess.run([quickbms, "-r", "-w", "-y", "-e", bms_script, target_path, unpacked_dir], capture_output=True)

          total_files = count_files()
          print(f"\nTotal Extracted Files Count: {total_files}")
          if total_files == 0:
              print("ERROR: Extraction returned 0 files. Check AES Key or format.")
              sys.exit(1)

          # Optional UAssetGUI Export
          if uasset_gui and os.path.exists(uasset_gui):
              print("\n=== STEP 4: Processing .uasset with UAssetGUI ===")
              uassets = []
              for r, _, fl in os.walk(unpacked_dir):
                  for f in fl:
                      if f.lower().endswith(".uasset"):
                          uassets.append(os.path.join(r, f))
              print(f"Found {len(uassets)} .uasset files.")
              for u in uassets[:5]:
                  try:
                      subprocess.run([uasset_gui, u, u + ".json"], timeout=10, capture_output=True)
                  except Exception:
                      pass

      - name: Commit and Push unpacked files to Repo
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git pull origin main --rebase || true
          git add -f unpacked/

          if ! git diff --staged --quiet; then
            echo "Committing extracted files..."
            git commit -m "Auto-unpacked assets extracted [skip ci]"
            git push origin HEAD:main
            echo "SUCCESS: Extracted assets pushed to repo unpacked/ directory!"
          else
            echo "No new files to commit in unpacked/."
          fi

      - name: Backup Artifact Zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-unpacked-all
          path: unpacked/
          retention-days: 2
