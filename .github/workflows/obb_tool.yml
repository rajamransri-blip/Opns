name: OBB & PAK Auto Unpacker

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Action (unpack ya repack)'
        required: true
        default: 'unpack'
        type: choice
        options:
          - unpack
          - repack
      aes_key:
        description: '(Optional) Custom AES Key agar auto-keys match na hon'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fix-folder-names:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Linux
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Folder Names
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python3 -c '
          import os, subprocess
          for item in os.listdir("."):
              if os.path.isdir(item) and (item.endswith(" ") or "PC" in item):
                  subprocess.run(["git", "mv", item, "tools"])
          '
          git add tools/ 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Normalize tool folder [skip ci]" && git push origin HEAD:main)

  process:
    needs: fix-folder-names
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inspect Tool Scripts & Execute Binaries
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " STEP 1: Tool Discovery & Script Analysis"
          Write-Host "=========================================="
          if (-not (Test-Path "original_pak")) { New-Item -ItemType Directory -Path "original_pak" }
          if (-not (Test-Path "unpacked")) { New-Item -ItemType Directory -Path "unpacked" }

          $quickbms = (Get-ChildItem -Recurse -Filter "quickbms_4gb_files.exe" | Select-Object -First 1).FullName
          if (-not $quickbms) { $quickbms = (Get-ChildItem -Recurse -Filter "quickbms.exe" | Select-Object -First 1).FullName }

          $bmsScript = (Get-ChildItem -Recurse -Filter "script.bms" | Select-Object -First 1).FullName
          $uassetGui = (Get-ChildItem -Recurse -Filter "UAssetGUI.exe" | Select-Object -First 1).FullName

          Write-Host "QuickBMS: $quickbms"
          Write-Host "Script  : $bmsScript"
          Write-Host "UAsset  : $uassetGui"

          # Print internal batch file contents for inspection
          Get-ChildItem -Recurse -Filter "reimport*.bat" | ForEach-Object {
              Write-Host "`n[Content of $($_.Name)]:"
              Get-Content $_.FullName | Write-Host
          }

          Write-Host "`n=========================================="
          Write-Host " STEP 2: Input Target Setup"
          Write-Host "=========================================="
          $targetPath = $null

          $parts = Get-ChildItem -Path "original_pak" -File | Where-Object { $_.Name -match "\.part_\d+$" } | Sort-Object Name
          if (-not $parts) { $parts = Get-ChildItem -Recurse -File | Where-Object { $_.Name -match "\.part_\d+$" } | Sort-Object Name }

          if ($parts.Count -gt 0) {
              Write-Host "Merging $($parts.Count) split chunk(s)..."
              $mergedFile = "original_pak\game_patch.pak"
              $fs = [System.IO.File]::Create($mergedFile)
              foreach ($p in $parts) {
                  $bytes = [System.IO.File]::ReadAllBytes($p.FullName)
                  $fs.Write($bytes, 0, $bytes.Length)
              }
              $fs.Close()
              $targetPath = (Get-Item $mergedFile).FullName
          } else {
              $target = Get-ChildItem -Path "original_pak" -File | Where-Object { $_.Extension -match "\.(pak|obb)$" } | Select-Object -First 1
              if (-not $target) { $target = Get-ChildItem -Recurse -File | Where-Object { $_.Extension -match "\.(pak|obb)$" } | Select-Object -First 1 }
              if ($target) { $targetPath = $target.FullName }
          }

          if (-not $targetPath -or -not (Test-Path $targetPath)) {
              Write-Error "No game package found in repo!"
              exit 1
          }
          Write-Host "Target Verified: $targetPath ($([math]::Round((Get-Item $targetPath).Length/1MB, 2)) MB)"

          Write-Host "`n=========================================="
          Write-Host " STEP 3: Multi-Key Unpack Engine"
          Write-Host "=========================================="
          $action = "${{ github.event.inputs.action_type }}"
          $extractedCount = 0

          if ($action -eq "unpack") {
              # Download updated UE4 bms script
              $ue4Script = "ue4_pak.bms"
              Invoke-WebRequest -Uri "https://aluigi.altervista.org/bms/unreal_tournament_4.bms" -OutFile $ue4Script -UserAgent "QuickBMS"

              # List of known PUBG Mobile / BGMI AES Keys to auto-try
              $keys = @(
                  "${{ github.event.inputs.aes_key }}".Trim(),
                  "0x8035DAFA76249A09FD0F210452E0EF3EAF7F83D398E187EBBE52D82D6D3A0A06",
                  "0xC7497217B27C12F6C6C8ACF8CF87BE792A62C0EEBC3DE33DF7EBCEBFF09A1208",
                  "0xDD11E2CF20942F9E58A4633887192C2B295627E431EB9A17154E89745A1A4E7A",
                  "0x48657820746F204153434949202D204F6E6C696E6520746F6F6C000000000000",
                  "0x9D8C9A4A4FA082F213EED604B6E756237181685EEDA82216437617D7AA5231AF",
                  ""
              )

              # Filter empty entries
              $keys = $keys | Where-Object { $_ -ne "" }

              # 1. Try local script.bms first
              Write-Host "[1/3] Trying with local script.bms..."
              & "$quickbms" -o -y -e "$bmsScript" "$targetPath" "unpacked" 2>$null
              $extractedCount = (Get-ChildItem -Path "unpacked" -Recurse -File).Count

              # 2. If 0 files, iterate through AES keys with UE4 script
              if ($extractedCount -eq 0) {
                  Write-Host "`n[2/3] Local script returned 0 files. Auto-testing AES keys on UE4 Engine..."
                  foreach ($k in $keys) {
                      Write-Host "-> Testing Key: $k"
                      & "$quickbms" -o -y -e -s "set KEY string $k" "$ue4Script" "$targetPath" "unpacked"
                      $extractedCount = (Get-ChildItem -Path "unpacked" -Recurse -File).Count
                      if ($extractedCount -gt 0) {
                          Write-Host "`n✓ SUCCESS! Key matched: $k ($extractedCount files extracted)"
                          break
                      }
                  }
              }

              # 3. Fallback: 7-Zip Container extraction
              if ($extractedCount -eq 0) {
                  Write-Host "`n[3/3] Trying 7-Zip extraction..."
                  7z x "$targetPath" "-ounpacked" -y | Out-Null
                  $extractedCount = (Get-ChildItem -Path "unpacked" -Recurse -File).Count
              }
          } else {
              # Repack logic
              Write-Host "Executing Repack via QuickBMS Reimport..."
              & "$quickbms" -r -w -y -e "$bmsScript" "$targetPath" "unpacked"
              $extractedCount = 1
          }

          Write-Host "`nTotal Extracted Files: $extractedCount"
          if ($extractedCount -eq 0) {
              Write-Error "Extraction fail ho gayi! Sahi AES key provide karein."
              exit 1
          }

          Write-Host "`n=========================================="
          Write-Host " STEP 4: Processing .uasset with UAssetGUI"
          Write-Host "=========================================="
          if ($uassetGui -and (Test-Path $uassetGui)) {
              $uassets = Get-ChildItem -Path "unpacked" -Recurse -Filter "*.uasset"
              Write-Host "Total .uasset files found: $($uassets.Count)"
              foreach ($u in ($uassets | Select-Object -First 10)) {
                  Write-Host "Exporting to JSON: $($u.Name)"
                  try {
                      & "$uassetGui" "$($u.FullName)" "$($u.FullName).json" 2>$null
                  } catch {}
              }
          }

      - name: Commit and Push unpacked files to Repo
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git pull origin main --rebase || true
          git add -f unpacked/

          if ! git diff --staged --quiet; then
            echo "Committing extracted files..."
            git commit -m "Auto-unpacked assets extracted [skip ci]"
            git push origin HEAD:main
            echo "SUCCESS: Extracted assets pushed to repo unpacked/ directory!"
          else
            echo "No new files to commit in unpacked/."
          fi

      - name: Backup Artifact Zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-unpacked-all
          path: unpacked/
          retention-days: 2
